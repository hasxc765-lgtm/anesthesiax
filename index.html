<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnesthesiaX</title>

  <!-- أداة Eruda للفحص -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- كاشف الأخطاء -->
  <script>
    window.addEventListener('error', function(e) {
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;top:0;left:0;width:100%;z-index:99999;background:#be123c;color:#fff;padding:12px;font-size:11px;font-family:monospace;direction:ltr;word-break:break-all;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
      box.innerHTML = '<b>🚨 JS Error:</b> ' + e.message + '<br><b>File:</b> ' + e.filename + '<br><b>Line:</b> ' + e.lineno;
      document.body.appendChild(box);
    });
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💉</span>
        <div>
          <h1 class="font-black text-lg text-blue-600 leading-none">AnesthesiaX</h1>
          <p class="text-[10px] text-slate-400">Professional Anesthesia Toolkit</p>
        </div>
      </div>
      <div id="app-nav"></div>
    </div>
  </header>

  <main id="app-content" class="p-4"></main>

  <!-- 🔑 السطر الأهم لاستدعاء تشغيل المشغّل الرئيسي -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

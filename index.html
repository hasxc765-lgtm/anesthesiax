<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnesthesiaX - المنصة الحسابية الطبية للتخدير</title>
  <!-- تحميل التنسيقات مباشرة لتفادي مشاكل التحميل -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4">

  <!-- Header -->
  <header class="max-w-2xl mx-auto flex justify-between items-center py-4 border-b border-slate-200">
    <div>
      <h1 class="text-2xl font-bold text-blue-600">AnesthesiaX 💉</h1>
      <p class="text-xs text-slate-500">المنصة الحسابية الطبية للتخدير</p>
    </div>
    <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-lg">v2.5 Refactored</span>
  </header>

  <!-- Global Clinical Safety Disclaimer -->
  <div class="max-w-2xl mx-auto my-3 p-3 bg-amber-50 border-r-4 border-amber-500 text-amber-900 text-xs rounded-l-xl">
    <div class="font-bold flex items-center gap-1 mb-0.5">
      <span>⚠️</span> <span>تنبيه سلامة سريري (CLINICAL SAFETY NOTICE)</span>
    </div>
    <p class="opacity-90">هذه الحاسبة مرجع تعليمي واستشاري. يجب دائماً التأكد من تركيز الأمبول المتاح والبروتوكول المحلي قبل إعطاء أي دواء.</p>
  </div>

  <!-- Weight Input & Calculator Banner -->
  <section class="max-w-2xl mx-auto my-3 p-4 bg-blue-600 text-white rounded-2xl shadow-md space-y-2">
    <label class="block text-xs font-semibold">⚖️ أدخل وزن المريض لحساب الجرعة والحجم تلقائياً:</label>
    <div class="flex gap-2">
      <!-- ضبط اتجاه الرقم ولونه بوضوح لتفادي اختفائه في الموبايل -->
      <input 
        type="number" 
        id="patientWeight" 
        placeholder="الوزن بـ (kg) مثل: 70" 
        dir="ltr"
        style="color: #000000 !important; background-color: #ffffff !important;"
        class="w-full p-3 rounded-xl text-black font-bold text-center text-base focus:outline-none"
      >
      <button onclick="clearWeight()" class="px-4 bg-blue-800 hover:bg-blue-900 text-xs rounded-xl font-bold transition">مسح</button>
    </div>
  </section>

  <!-- Search & Category Filters -->
  <section class="max-w-2xl mx-auto mb-4 space-y-3">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="🔍 ابحث عن دواء (Propofol, Ketamine, Ephedrine)..." 
      style="color: #000000 !important; background-color: #ffffff !important;"
      class="w-full p-3.5 rounded-xl border-2 border-blue-500 text-black shadow-sm focus:outline-none text-sm"
    >

    <div class="flex gap-2 overflow-x-auto pb-2 text-xs" id="categoryButtons">
      <button onclick="setCategory('All')" data-cat="All" class="cat-btn active px-3 py-1.5 rounded-lg bg-blue-600 text-white whitespace-nowrap border border-blue-600">الكل</button>
      <button onclick="setCategory('Induction')" data-cat="Induction" class="cat-btn px-3 py-1.5 rounded-lg bg-white border border-slate-200 whitespace-nowrap">Induction</button>
      <button onclick="setCategory('Muscle Relaxant')" data-cat="Muscle Relaxant" class="cat-btn px-3 py-1.5 rounded-lg bg-white border border-slate-200 whitespace-nowrap">Muscle Relaxant</button>
      <button onclick="setCategory('Vasopressor')" data-cat="Vasopressor" class="cat-btn px-3 py-1.5 rounded-lg bg-white border border-slate-200 whitespace-nowrap">Vasopressor</button>
      <button onclick="setCategory('Opioid')" data-cat="Opioid" class="cat-btn px-3 py-1.5 rounded-lg bg-white border border-slate-200 whitespace-nowrap">Opioid</button>
    </div>
  </section>

  <!-- Drugs Container -->
  <main class="max-w-2xl mx-auto space-y-4" id="drugsContainer"></main>

  <script type="module" src="js/app.js"></script>
</body>
  </html>

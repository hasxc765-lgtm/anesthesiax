<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnesthesiaX - المنصة الحسابية الطبية للتخدير</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnesthesiaX">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063822.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">

  <script>
    // 1. فحص تفضيل الوضع المظلم وتطبيقه
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // 2. تسجيل الـ Service Worker ليعمل الموقع بدون إنترنت (Offline Mode)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('✅ AnesthesiaX Offline PWA Active!'))
          .catch(err => console.log('❌ ServiceWorker Error:', err));
      });
    }
  </script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen p-3 transition-colors duration-200 antialiased font-sans select-none">

  <header class="sticky top-0 z-50 bg-slate-900/90 dark:bg-slate-900/95 backdrop-blur-md text-white p-3 rounded-2xl mb-4 shadow-md flex justify-between items-center border border-slate-800">
    <div class="flex items-center gap-2 cursor-pointer" onclick="window.navigateTo && window.navigateTo('dashboard')">
      <span class="text-xl">💉</span>
      <div>
        <h1 class="font-bold text-sm text-indigo-400">AnesthesiaX</h1>
        <p class="text-[9px] text-slate-400" dir="ltr">Clinical Decision Support</p>
      </div>
    </div>

    <button id="btnToggleDarkMode" type="button" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-xl font-bold text-xs flex items-center gap-1.5 transition border border-slate-700 cursor-pointer">
      <span id="darkIcon">🌙</span>
      <span id="darkText">الوضع المظلم</span>
    </button>
  </header>

  <div id="app-nav"></div>

  <div id="app-content"></div>

  <script type="module" src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('btnToggleDarkMode');
      const icon = document.getElementById('darkIcon');
      const text = document.getElementById('darkText');

      function updateUI() {
        const isDark = document.documentElement.classList.contains('dark');
        if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        if (text) text.textContent = isDark ? 'الوضع المضيء' : 'الوضع المظلم';
      }

      updateUI();

      if (btn) {
        btn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          updateUI();
        });
      }
    });
  </script>

</body>
</html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnesthesiaX</title>
  
  <!-- 🚨 كاشف الأخطاء المباشر للشاشة البيضاء -->
  <script>
    window.addEventListener('error', function(e) {
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;top:0;left:0;width:100%;z-index:99999;background:#be123c;color:#fff;padding:12px;font-size:11px;font-family:monospace;direction:ltr;word-break:break-all;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
      box.innerHTML = '<b>🚨 JS Error:</b> ' + e.message + '<br><b>File:</b> ' + e.filename + '<br><b>Line:</b> ' + e.lineno;
      document.body.appendChild(box);
    });
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnesthesiaX - المنصة الحسابية الطبية للتخدير</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnesthesiaX">
  <link rel="apple-touch-icon" href="./icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">

  <script>
    // 1. فحص وتطبيق الوضع المظلم مبكراً لمنع الوميض
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // 2. تسجيل الـ Service Worker ليعمل بدون إنترنت
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('✅ AnesthesiaX Offline PWA Active!'))
          .catch(err => console.log('❌ ServiceWorker Error:', err));
      });
    }
  </script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen p-3 transition-colors duration-200 antialiased font-sans select-none">

  <header class="sticky top-0 z-50 bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur-md text-white p-3 rounded-2xl mb-3 shadow-lg flex justify-between items-center border border-slate-800">
    <div class="flex items-center gap-2 cursor-pointer" onclick="window.navigateTo && window.navigateTo('dashboard')">
      <span class="text-xl">💉</span>
      <div>
        <h1 class="font-bold text-sm text-indigo-400">AnesthesiaX</h1>
        <p class="text-[9px] text-slate-400" dir="ltr">Clinical Decision Support</p>
      </div>
    </div>
  </header>

  <div id="pwaInstallBanner" class="hidden mb-4 bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 text-white p-3 rounded-2xl shadow-xl border border-indigo-500/30 flex justify-between items-center transition-all duration-300">
    <div class="flex items-center gap-3">
      <img src="./icon.png" alt="AnesthesiaX" class="w-10 h-10 rounded-xl shadow border border-indigo-400/30 object-cover">
      <div>
        <h4 class="font-bold text-xs text-indigo-300">تثبيت تطبيق AnesthesiaX</h4>
        <p id="pwaSubText" class="text-[10px] text-slate-300">استخدمه فوراً وبدون إنترنت في صالة العمليات</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnInstallPWA" type="button" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-md transition cursor-pointer">
        تثبيت 📲
      </button>
      <button type="button" onclick="document.getElementById('pwaInstallBanner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xs px-1">
        ✕
      </button>
    </div>
  </div>

  <div id="app-nav"></div>
  <div id="app-content"></div>

  <script type="module" src="js/app.js"></script>

  <script>
    // أ. كود إدارة الوضع المظلم العام (يعمل تلقائياً عند الضغط على الزر/النص في أي مكان داخل التطبيق)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('#btnToggleDarkMode');
      if (btn) {
        e.preventDefault();
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        const icon = document.getElementById('darkIcon');
        const text = document.getElementById('darkText');
        if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        if (text) text.textContent = isDark ? 'الوضع المضيء' : 'الوضع المظلم';
      }
    });

    // ب. إدارة إشعار التثبيت الذكي (Android & iOS)
    let deferredPrompt;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn = document.getElementById('btnInstallPWA');
    const pwaSubText = document.getElementById('pwaSubText');

    // كشف أجهزة الآيفون والآيباد iOS
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    if (isIos && !isStandalone) {
      if (installBanner) installBanner.classList.remove('hidden');
      if (pwaSubText) pwaSubText.textContent = "اضغط زر المشاركة 📤 ثم 'إضافة إلى الشاشة الرئيسية'";
      if (installBtn) installBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBanner) installBanner.classList.remove('hidden');
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('Install choice:', outcome);
          deferredPrompt = null;
        }
        if (installBanner) installBanner.classList.add('hidden');
      });
    }
  </script>

</body>
</html>
